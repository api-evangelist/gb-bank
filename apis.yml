name: GB Bank
kind: company
description: GB Bank Limited is a UK challenger bank headquartered in Middlesbrough
  (2 Centre Square) with a London office (73 Brook Street, Mayfair). Wholly owned and
  privately backed rather than a mutual building society, it secured its full UK banking
  licence in 2022 and is authorised by the Prudential Regulation Authority and regulated
  by the Financial Conduct Authority and the PRA (Financial Services Register number
  850286). GB Bank funds SME regional property developers and investors with development
  finance, buy-to-let and bridging loans (typically between £26k and £5m across underserved
  UK regions) and funds that lending with retail deposits - fixed-rate bonds, notice
  accounts and easy-access savings accounts protected by the FSCS up to £85,000, managed
  through an online portal and a GB Bank mobile app. As a small, non-CMA9 FCA-authorised
  bank focused on savings and secured lending, GB Bank does not operate a public developer
  portal or a documented UK Open Banking (OBIE / PSD2) API surface; the Open Banking
  API families listed here are represented as the shared industry standard the bank
  would conform to as an FCA-authorised ASPSP, and are unverified for GB Bank pending
  a confirmed developer portal or Open Data endpoint.
