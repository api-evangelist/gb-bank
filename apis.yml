  name: GB Bank Open Data API
  description: >-
    UK Open Banking Open Data API (OBIE standard, v1.3) - the public, unauthenticated
    reference-data surface for ATMs, Branches, Personal Current Accounts, Business
    Current Accounts, Unsecured SME Loans and Commercial Credit Cards. Represented
    here as the shared OBIE Open Data Standard; UNVERIFIED for GB Bank - no live Open
    Data endpoint was confirmed on a gbbank.co.uk host (no fabricated base URL).
  humanURL: https://github.com/OpenBankingUK/opendata-api-docs-pub
