- aid: gb-bank:gb-bank-account-transaction-information-api
  name: GB Bank Account and Transaction Information API (AIS)
  description: >-
    UK Open Banking Read/Write Account & Transaction Information API (AISP) - the OBIE
    standard for accessing account, balance, transaction and statement data with
